name: Auto sync nhẹ (3 nguồn)

# Chạy ngầm, không cần mở trang admin. Mỗi lượt chỉ đọc page 1 "phim mới cập
# nhật" của 3 nguồn, chỉ sync phim có mốc modified đổi và tối đa 1 phim mới.
# GitHub `schedule` đang không sinh run nên lịch 15 phút thực tế do
# scripts/trigger-dispatch.ps1 + Task Scheduler bắn workflow_dispatch. Cron ở
# dưới giữ lại làm dự phòng, dùng phút lệch giờ để tránh cao tải.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Chạy thử (không ghi vào DB)"
        type: boolean
        default: false

# Không để auto-sync chồng với sync tay (sync-episodes.yml).
concurrency:
  group: nhotphim-sync
  cancel-in-progress: false

jobs:
  auto-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # NguonC chặn IP runner. Máy nhà quét rồi đẩy JSON lên nhánh nc-cache;
      # workflow chỉ tải file nhỏ này (~20KB) thay vì gọi API NguonC.
      - name: Lấy cache danh sách NguonC
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          gh api "repos/${{ github.repository }}/contents/nc-latest.json?ref=nc-cache" \
            --jq .content | base64 -d > nc-latest.json
          echo "cache bytes: $(wc -c < nc-latest.json)"
      - name: Chạy auto-sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          NGUONC_LIST_FILE: nc-latest.json
        run: node scripts/auto-sync.js
