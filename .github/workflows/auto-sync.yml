name: Auto sync nhẹ (3 nguồn)

# Chạy ngầm, không cần mở trang admin. Mỗi lượt chỉ đọc page 1 "phim mới cập
# nhật" của 3 nguồn, sync phim có mốc modified đổi (có quét lại định kỳ) và tối
# đa 1 phim Trung Quốc mới từ KKPhim/VodPhim.
# GitHub `schedule` có thể chạy trễ/không đều nên lịch 30 phút chính do
# scripts/trigger-dispatch.ps1 + Task Scheduler bắn workflow_dispatch ở khung
# :00/:30. Cron ở dưới là dự phòng.
on:
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Chạy thử (không ghi vào DB)"
        type: boolean
        default: false

# Chỉ có 1 workflow sync nên không cho chạy chồng chính nó.
concurrency:
  group: nhotphim-sync
  cancel-in-progress: false

jobs:
  auto-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # NguonC chặn IP runner. Máy nhà fetch danh sách + detail rồi đẩy JSON lên
      # nhánh nc-cache; workflow chỉ tải file này thay vì gọi API NguonC.
      - name: Lấy cache danh sách + chi tiết NguonC
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          gh api "repos/${{ github.repository }}/contents/nc-latest.json?ref=nc-cache" \
            --jq .content | base64 -d > nc-latest.json
          echo "cache bytes: $(wc -c < nc-latest.json)"
      - name: Chạy auto-sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          NGUONC_LIST_FILE: nc-latest.json
          AUTO_ADD_COUNTRY: cn
          AUTO_ADD_MIN_YEAR: "2026"
          SWEEP_EVERY: "4"
        run: node scripts/auto-sync.js
