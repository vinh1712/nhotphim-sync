name: Sync tập mới NhotPhim

# Không chạy theo khung giờ nữa. Việc phát hiện "phim mới cập nhật" của
# NguonC/KKPhim/VodPhim do auto-sync.yml đảm nhận (mỗi 15 phút).
# Workflow này chỉ giữ lại để chạy tay khi cần quét toàn bảng.
# Không chạy cùng lúc với auto-sync.yml để tránh ghi trùng episodes/thông báo.
concurrency:
  group: nhotphim-sync
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Chạy thử (không ghi vào DB)"
        type: boolean
        default: false
      skip_poster_fix:
        description: "Bỏ qua bước rà soát/sửa ảnh poster lỗi"
        type: boolean
        default: false
      skip_backfill_sv:
        description: "Bỏ qua bước bổ sung SV2/SV3 cho phim đã hoàn thành"
        type: boolean
        default: false
      skip_auto_add:
        description: "Bỏ qua bước tự thêm phim mới (Hàn Quốc, VodPhim)"
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Chạy sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          SKIP_POSTER_FIX: ${{ inputs.skip_poster_fix && '1' || '0' }}
          SKIP_BACKFILL_SV: ${{ inputs.skip_backfill_sv && '1' || '0' }}
          SKIP_AUTO_ADD: ${{ inputs.skip_auto_add && '1' || '0' }}
        run: node scripts/sync.js
